[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ibm-techqa-rag"
version = "0.1.0"
description = "RAG pipeline for IBM TechQA technical support QA"
authors = [{ name = "ajinkya252005" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
